id: org.SchildiChat.Revenge
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk
command: /app/bin/SchildiChatRevenge
modules:
  - name: install-openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk/install.sh
  - name: install-bundle
    buildsystem: simple
    build-commands:
      - mkdir -p /app/{bin,lib}
      - install -Dm755 bin/SchildiChatRevenge /app/bin/SchildiChatRevenge
      - cp -a lib/* /app/lib
    sources:
      - type: dir
        path: composeApp/build/compose/binaries/main-release/app/SchildiChatRevenge
  - name: install-desktop-app
    sources:
      - type: dir
        path: launcher
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/applications 
      - cp SchildiChatRevenge.desktop /app/share/applications/org.SchildiChat.Revenge.desktop
      - sed -i s/Icon=.*/Icon=org.SchildiChat.Revenge/ /app/share/applications/org.SchildiChat.Revenge.desktop
  - name: install-icon
    sources:
      - type: dir
        path: graphics
    buildsystem: simple
    build-commands:
      - for i in 16 32 64 128 256 ; do mkdir -p /app/share/icons/hicolor/${i}x${i}/apps/; cp ic_launcher_${i}x${i}.png /app/share/icons/hicolor/${i}x${i}/apps/org.SchildiChat.Revenge.png; done
finish-args:
  # setup JRE and JDK path
  - --env=PATH=/app/bin:/app/jre/bin:/usr/bin
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Needs to talk to the network:
  - --share=network
  # Config and sessions
  - --filesystem=xdg-config/SchildiChatRevenge
  - --filesystem=xdg-data/SchildiChatRevenge
